name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ── macOS ネイティブビルド ─────────────────────────────────
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: 依存インストール
        run: |
          brew install openssl curl
          BREW_PREFIX="$(brew --prefix)"
          echo "PKG_CONFIG_PATH=${BREW_PREFIX}/opt/openssl/lib/pkgconfig:${BREW_PREFIX}/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: ビルド
        run: make

      - name: テスト
        run: |-
          make test
          make test-package

          make test-tooling test-conformance test-abi

      - name: バイナリをリネーム
        run: |
          cp nihongo nihongo-macos
          shasum -a 256 nihongo-macos > nihongo-macos.sha256

      - name: CI アーティファクト保存
        uses: actions/upload-artifact@v4
        with:
          name: nihongo-macos
          path: |
            nihongo-macos
            nihongo-macos.sha256
      - name: Sign build provenance and SBOM
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/release-integrity
        with:
          subject-path: nihongo-macos
          artifact-name: sbom-build-macos

      - name: Releases にアップロード
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            nihongo-macos
            nihongo-macos.sha256

  # ── Linux ネイティブビルド ────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: 依存インストール
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev

      - name: ビルド
        run: make

      - name: テスト
        run: |-
          make test
          make test-package

          make test-tooling test-conformance test-abi

      - name: バイナリをリネーム
        run: |
          cp nihongo nihongo-linux-x64
          sha256sum nihongo-linux-x64 > nihongo-linux-x64.sha256

      - name: CI アーティファクト保存
        uses: actions/upload-artifact@v4
        with:
          name: nihongo-linux-x64
          path: |
            nihongo-linux-x64
            nihongo-linux-x64.sha256
      - name: Sign build provenance and SBOM
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/release-integrity
        with:
          subject-path: nihongo-linux-x64
          artifact-name: sbom-build-linux

      - name: Releases にアップロード
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            nihongo-linux-x64
            nihongo-linux-x64.sha256

  # ── Windows インストーラー (mingw-w64 クロスコンパイル + NSIS) ─
  build-windows-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: ツールインストール
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            nsis \
            curl \
            xz-utils

      - name: curl for Windows のセットアップ
        run: bash win/setup_curl.sh

      - name: hajimu.exe をビルド
        run: |
          bash win/build_win.sh
          echo "--- win/dist の内容 ---"
          ls -lh win/dist/

      - name: NSIS インストーラーを生成
        run: |
          makensis -NOCD win/installer.nsi
          ls -lh win/dist/hajimu_setup.exe

      - name: チェックサム生成
        run: |
          sha256sum win/dist/hajimu.exe > win/dist/hajimu.exe.sha256
          sha256sum win/dist/hajimu_setup.exe > win/dist/hajimu_setup.exe.sha256

      - name: CI アーティファクト保存
        uses: actions/upload-artifact@v4
        with:
          name: hajimu-windows
          path: |
            win/dist/hajimu_setup.exe
            win/dist/hajimu.exe
            win/dist/hajimu_setup.exe.sha256
            win/dist/hajimu.exe.sha256
      - name: Sign build provenance and SBOM
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/release-integrity
        with:
          subject-path: win/dist/*.exe
          artifact-name: sbom-build-windows-installer

      - name: Releases にアップロード
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            win/dist/hajimu_setup.exe
            win/dist/hajimu.exe
            win/dist/hajimu_setup.exe.sha256
            win/dist/hajimu.exe.sha256
