name: Development Foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: make -j4
      - run: make test-conformance test-tooling test-abi test-utf8 test-embed test-distribution
      - run: bash tests/test_package_manager.sh
      - run: openssl dgst -sha256 -verify registry/public-key.pem -signature registry/index.json.sig registry/index.json
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang libcurl4-openssl-dev
      - run: make CC=clang CFLAGS='-Wall -Wextra -std=gnu11 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address,undefined -lm -lcurl -lpthread -ldl' -j4
      - run: make test-conformance test-tooling test-abi
        env:
          ASAN_OPTIONS: detect_leaks=0
      - name: 解析APIのリーク検査
        run: |
          printf 'var x = "hello"\nprint(x)\n' | ASAN_OPTIONS=detect_leaks=1 ./nihongo --analyze memory.haj >/dev/null
          printf 'var x =\n' | ASAN_OPTIONS=detect_leaks=1 ./nihongo --analyze invalid.haj >/dev/null
          ASAN_OPTIONS=detect_leaks=1 ./nihongo --analyze memory.haj < tests/tooling_memory.haj > build/memory-analysis.json
          node -e 'if (!JSON.parse(require("node:fs").readFileSync("build/memory-analysis.json", "utf8")).valid) process.exit(1)'
          printf 'import missing\n' | ASAN_OPTIONS=detect_leaks=1 ./nihongo --analyze invalid.haj >/dev/null
      - run: make CC=clang CFLAGS='-std=gnu11 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer' test-utf8
      - run: make fuzz-smoke
      - run: make fuzz-parser && ASAN_OPTIONS=detect_leaks=0 build/fuzz-parser -runs=1000 -max_len=512
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parser-fuzz-reproductions
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: emscripten-core/setup-emsdk@667eb33f24e84e7f362c16d8d7fff0629a73e15e # v15
        with:
          version: 5.0.1
          emsdk-version: 5.0.5
          actions-cache-folder: emsdk-cache
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: make -j4
      - run: make wasm WASM_OUT_DIR=build/wasm
      - run: HAJIMU_WASM_JS="$PWD/build/wasm/hajimu_wasm.js" node tests/json.test.cjs
